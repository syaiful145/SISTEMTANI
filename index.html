<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Manajemen Pertanian</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Halaman login -->
  <section id="login-page">
    <div class="login-card">
      <h1>Sistem Pertanian</h1>
      <p class="muted">Silakan masuk atau daftarkan akun pegawai.</p>
      <div class="auth-tabs" role="tablist" aria-label="Pilihan akun">
        <button type="button" class="auth-tab active" id="show-login">Login</button>
        <button type="button" class="auth-tab" id="show-register">Daftar Pegawai</button>
      </div>
      <form id="login-form" autocomplete="on">
        <input id="l-user" placeholder="Username" autocomplete="username" required>
        <input id="l-pass" type="password" placeholder="Password" autocomplete="current-password" required>
        <p id="l-err" class="form-error" role="alert"></p>
        <button class="btn" type="submit">Masuk</button>
      </form>
      <form id="register-form" class="hidden" autocomplete="on">
        <input id="r-nama" placeholder="Nama lengkap" autocomplete="name" required>
        <input id="r-id" placeholder="ID pegawai" required>
        <input id="r-email" type="email" placeholder="Email aktif" autocomplete="email" required>
        <input id="r-jabatan" placeholder="Jabatan" required>
        <input id="r-telepon" type="tel" placeholder="Nomor telepon" autocomplete="tel" required>
        <input id="r-alamat" placeholder="Alamat" autocomplete="street-address" required>
        <input id="r-pass" type="password" placeholder="Buat password (minimal 8 karakter)" autocomplete="new-password" minlength="8" required>
        <input id="r-pass2" type="password" placeholder="Ulangi password" autocomplete="new-password" minlength="8" required>
        <p id="r-msg" class="form-message" role="status"></p>
        <button class="btn" type="submit">Kirim Pendaftaran</button>
      </form>
      <p class="login-hint" id="login-hint">Akun demo lokal: admin / admin123 · budi / budi123 · siti / siti123</p>
    </div>
  </section>

  <!-- Shell aplikasi -->
  <div id="app" class="hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand">🌾 Sistem Pertanian</div>
      <nav id="nav"></nav>
    </aside>
    <div class="overlay" id="overlay"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" aria-label="Menu">☰</button>
        <h1 id="page-title"></h1>
        <div class="top-right">
          <a href="#notifikasi" class="bell hidden" id="bell" title="Notifikasi">
            🔔<span class="badge hidden" id="badge">0</span>
          </a>
          <span id="user-name" class="user-text"></span>
          <button class="btn ghost small" id="logout">Keluar</button>
        </div>
      </header>
      <main id="content"></main>
    </div>
  </div>

  <div id="modal" class="modal hidden"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
