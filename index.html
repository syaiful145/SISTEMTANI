<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Manajemen Pertanian</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Halaman login -->
  <section id="login-page">
    <div class="login-card">
      <h1>Sistem Pertanian</h1>
      <p class="muted">Masuk untuk mengelola kegiatan lahan.</p>
      <form id="login-form" autocomplete="off">
        <input id="l-user" placeholder="Username" required>
        <input id="l-pass" type="password" placeholder="Password" required>
        <p id="l-err" class="form-error"></p>
        <button class="btn" type="submit">Masuk</button>
      </form>
      <p class="login-hint">Akun demo: admin / admin123 · budi / budi123 · siti / siti123</p>
    </div>
  </section>

  <!-- Shell aplikasi -->
  <div id="app" class="hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand">🌾 Sistem Pertanian</div>
      <nav id="nav"></nav>
    </aside>
    <div class="overlay" id="overlay"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" aria-label="Menu">☰</button>
        <h1 id="page-title"></h1>
        <div class="top-right">
          <a href="#notifikasi" class="bell hidden" id="bell" title="Notifikasi">
            🔔<span class="badge hidden" id="badge">0</span>
          </a>
          <span id="user-name" class="user-text"></span>
          <button class="btn ghost small" id="logout">Keluar</button>
        </div>
      </header>
      <main id="content"></main>
    </div>
  </div>

  <div id="modal" class="modal hidden"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
